# Component -> owned path globs. spec_review.py uses this to pick which checklists apply to a
# diff; status.py uses the same component ids. One entry per row of DECISIONS §17.3.
[schemas_ddl]
paths = ["docs/schemas/**", "data/bigquery/ddl/**", "tests/contract/**"]

[generator]
paths = ["data/generator/**", "data/public/**", "DATA_LICENSES.md"]

[sense_forecasts]
paths = ["jobs/sense/forecast*", "jobs/sense/backtest*", "data/bigquery/sense/forecast*", "data/bigquery/sense/regressors*"]

[sense_gaps]
paths = ["jobs/sense/gaps*", "data/bigquery/sense/gaps*", "agents/gate/sellby.py"]

[segments_substitutes]
paths = ["jobs/sense/segments*", "jobs/sense/substitutes*", "data/bigquery/sense/segments*", "data/bigquery/sense/substitutes*"]

[estimator_gate]
paths = ["agents/gate/**", "tests/unit/**", "config/tenant*.toml"]

[planner_agent]
paths = ["agents/planner/**", "tests/agents/test_planner*"]

[approve_assignment]
paths = ["services/api/approve*", "services/api/assignment*", "services/api/main.py"]

[customer_agent]
paths = ["agents/customer/**", "agents/mcp_orders/**", "fixtures/conversations/**", "tests/agents/test_customer*"]

[vision_intake]
paths = ["agents/capture/vision*", "docs/schemas/vision_intake.schema.json", "fixtures/photos/**"]

[voice]
paths = ["agents/capture/voice*", "agents/capture/live*"]

[measure]
paths = ["jobs/measure/**", "data/bigquery/measure/**"]

[web]
paths = ["web/**"]

[event_log_replay]
paths = ["services/api/events*", "agents/gate/store.py", "fixtures/runs/**"]

[infra_deploy]
paths = ["infra/**", ".github/**", "config/models.toml", "Makefile", "services/api/health*"]

[docs_submission]
paths = ["README.md", "docs/**", "eval/**", "harness/**", "STATUS.md"]

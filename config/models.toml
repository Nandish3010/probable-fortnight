# Model IDs are pinned here and nowhere else. Verify each ID in Model Garden
# before the first deploy and record its retirement date. Never rely on a
# framework default model.
#
# backend: "stub" returns golden fixtures (used in CI); "vertex" calls Gemini
# through Vertex AI / Agent Platform in the project below.
backend = "stub"

[vertex]
project_env = "GOOGLE_CLOUD_PROJECT"
location = "asia-south1"          # fallback: asia-southeast1 or us if a service is unavailable

[ids]
# Verified 20 Sep 2026 by a real generateContent call against
# https://asia-south1-aiplatform.googleapis.com/.../publishers/google/models/<id>:generateContent
# in project amru-509214 -- not guessed. `flash` is read by agents/planner/agent.py,
# agents/customer/agent.py, agents/capture/vision.py, AND (as of 21 Sep 2026) by the BigQuery
# AI.GENERATE_TABLE remote model `taal.<flash id>_remote` used for copy generation
# (jobs/sense/copy.py::generate_copy_bigquery, services/api/approve.py) -- flash_lite was the
# originally intended model for that call, but it 404s in asia-south1 (see below) where the
# BigQuery dataset lives, and moving the dataset to us-central1 just to keep flash-lite was
# judged not worth it. `live` and `fallback` below remain unwired.
flash = "gemini-2.5-flash"          # planner, vision, chat, copy generation. Confirmed live in asia-south1.
# flash-lite and pro respond in us-central1 but 404 in asia-south1 -- Vertex model
# availability is per-region and asia-south1 is narrower than us-central1 as of this check.
flash_lite = "gemini-2.5-flash-lite"  # NOT wired to any code path (superseded by `flash` for copy generation; see above). NOT verified in asia-south1 (404); works in us-central1.
live = "gemini-2.0-flash-live-preview-04-09"  # voice session. NOT verified -- Live API uses a websocket endpoint this check does not exercise.
fallback = "gemini-2.5-flash"       # same as flash for now; a real fallback needs a distinct, separately-verified model.

[thinking]
planner_route = "low"
planner_final = "medium"
customer = "low"
stylist = "low"

# List prices used ONLY for the Cost Governor's estimates (DECISIONS §18.4); the billing export
# replaces them with measured cost. Estimates, not quotes.
[pricing]
usd_per_million_input = 0.75
usd_per_million_output = 3.75
cached_input_discount = 0.9
batch_discount = 0.5
inr_per_usd = 83.0
planner_tokens_in_per_loop = 6000
planner_tokens_out_per_loop = 1500
conversation_inr = 1.3

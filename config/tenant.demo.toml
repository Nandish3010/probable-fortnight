# Demo tenant: Kutumb Mart, Bengaluru. Synthetic; disclosed in README.
tenant_id = "kutumb-mart"
currency = "INR"
languages = ["en", "kn"]

[sellby_rule]
# FSSAI's advisory to e-commerce FBOs, as reported (Dec 2024)
# [CITATION: owner to paste primary URL]: "30 percent or 45 days before expiry
# at the time of delivery" -- the quoted wording is as reported and not yet
# checked against the primary. Wording is ambiguous. "min" reads it as
# "either condition satisfies" (cut-off = the earlier of 30% of shelf life and
# 45 days before expiry): a 7-day bread needs 2 days left, a 90-day chips pack
# 27 days. "max" is the stricter reading, under which nothing with a shelf life
# under 45 days can be sold online at all. The tenant chooses; the rule version
# is shown on every gap card.
version = "v1-either"
min_fraction_remaining = 0.30
min_days_remaining = 45
combine = "min"   # min(30% of shelf life, 45 days) before expiry

[thresholds]
min_rupees_at_stake_for_planner = 500
default_holdout_fraction = 0.10
min_holdout_fraction = 0.05
min_treated_n = 20
frequency_cap_per_7d = 2
slow_mover_days = 21
cost_ceiling_pct_of_rupees_at_stake = 2.0
unmet_demand_min_requests = 2
unmet_demand_lookback_days = 30
# Blanket-markdown counterfactual: units uplift per 1% of markdown, as a fraction of baseline
# (20% off -> +80% units at 4.0). An estimate; the estimator labels it. Replace with measured elasticity.
markdown_elasticity = 4.0
min_affinity = 0.3
transfer_cost_per_unit_inr = 2.0
# Customer Agent ad-hoc negotiation (agents/customer/tools.py::negotiate_offer): the hard ceiling
# on a discount the chat agent may offer a customer who asks directly, on a sku with no approved
# play targeting them. Distinct from any play's own mechanic_params.discount_pct -- a played
# discount is planner-drafted, guardrail-checked and holdout-measured; this one is a live,
# unmeasured, per-customer concession, so it is capped far more conservatively and additionally
# bounded by margin_floor_pct per category (never both at once -- whichever is lower wins).
ad_hoc_max_discount_pct = 8.0
# A repeat customer (>=1 past order at this tenant) gets this many extra points on top of the
# base ad-hoc discount, still capped by ad_hoc_max_discount_pct and the margin floor above.
ad_hoc_loyalty_bonus_pct = 3.0
# A volume_discount's min_qty is this many units above the customer's own median order size for
# the sku (or, with no direct-sku history, the category) -- a nudge past their habit, not a flat
# number the same for everyone.
ad_hoc_volume_nudge_step = 3
# A customer whose own median order size for the sku/category already meets or exceeds this many
# units gets no volume_discount at all: they were always going to buy that much, so discounting it
# is margin given away for no incremental sale.
ad_hoc_volume_already_loyal_qty = 4

[margin_floor_pct]
default = 8.0
snacks = 8.0
beverages = 6.0
staples = 4.0
premium_tea = 12.0

[policy]
version = "v1"
text = """
Kutumb Mart pricing and promotion policy.
1. Never sell below the category margin floor.
2. Prefer bundles and transfers over blanket markdowns; markdowns are the last lever.
3. Never discount premium tea below 12% margin; prefer transfers for premium tea.
4. Any near-sell-by offer must state the best-before date to the customer.
5. Customers with an active subscription for a product never receive discount offers on it.
6. Do not push a product that is at risk of stockout at the same node.
7. Every play must carry a holdout of at least 5% so we can measure it.
"""

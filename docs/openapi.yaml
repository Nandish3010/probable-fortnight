      operationId: delete_feedback_feedback__response_id__delete
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Delete Feedback Feedback  Response Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApproveRequest:
      properties:
        play_id:
          type: string
          title: Play Id
        holdout_fraction:
          anyOf:
          - type: number
            maximum: 0.9
            minimum: 0.05
          - type: 'null'
          title: Holdout Fraction
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
        edits:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Edits
        approved_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Approved By
      type: object
      required:
      - play_id
      title: ApproveRequest
    ApproveResponseOut:
      properties:
        play_id:
          type: string
          title: Play Id
        status:
          type: string
          title: Status
        assignment:
          $ref: '#/components/schemas/AssignmentOut'
        offers_written:
          type: integer
          title: Offers Written
        regressor_rows_touched:
          type: integer
          title: Regressor Rows Touched
        copy:
          $ref: '#/components/schemas/CopyOut'
        forecast:
          $ref: '#/components/schemas/ForecastOut'
        source:
          type: string
          title: Source
        elapsed_ms:
          type: integer
          title: Elapsed Ms
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - play_id

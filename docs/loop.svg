<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The Taal loop</title>
<desc id="d">Five steps in a row: Forecast, Propose, Approve, Offer, Measure. An arrow returns from Measure to Forecast, labelled priors update.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a2a1f"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c4532d"/></marker></defs>
<rect width="1600" height="400" fill="#faf9f5"/>
<rect x="30" y="60" width="244" height="150" rx="18" fill="#ffffff" stroke="#1a2a1f" stroke-width="3"/>
<text x="52" y="104" font-size="22" font-weight="600" letter-spacing="2" fill="#4d7a5e">1</text>
<text x="152.0" y="144" text-anchor="middle" font-size="40" font-weight="700" fill="#1a2a1f">Forecast</text>
<text x="152.0" y="182" text-anchor="middle" font-size="19" fill="#4a554e">nightly, per SKU and store</text>
<path d="M280 135H348" stroke="#1a2a1f" stroke-width="4" fill="none" marker-end="url(#ah)"/>
<rect x="354" y="60" width="244" height="150" rx="18" fill="#ffffff" stroke="#1a2a1f" stroke-width="3"/>
<text x="376" y="104" font-size="22" font-weight="600" letter-spacing="2" fill="#4d7a5e">2</text>
<text x="476.0" y="144" text-anchor="middle" font-size="40" font-weight="700" fill="#1a2a1f">Propose</text>
<text x="476.0" y="182" text-anchor="middle" font-size="19" fill="#4a554e">a play, priced in rupees</text>
<path d="M604 135H672" stroke="#1a2a1f" stroke-width="4" fill="none" marker-end="url(#ah)"/>
<rect x="678" y="60" width="244" height="150" rx="18" fill="#1a2a1f" stroke="#1a2a1f" stroke-width="3"/>
<text x="700" y="104" font-size="22" font-weight="600" letter-spacing="2" fill="#4d7a5e">3</text>
<text x="800.0" y="144" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">Approve</text>
<text x="800.0" y="182" text-anchor="middle" font-size="19" fill="#c3d6c8">a human, with a holdout</text>
<path d="M928 135H996" stroke="#1a2a1f" stroke-width="4" fill="none" marker-end="url(#ah)"/>
<rect x="1002" y="60" width="244" height="150" rx="18" fill="#ffffff" stroke="#1a2a1f" stroke-width="3"/>
<text x="1024" y="104" font-size="22" font-weight="600" letter-spacing="2" fill="#4d7a5e">4</text>
<text x="1124.0" y="144" text-anchor="middle" font-size="40" font-weight="700" fill="#1a2a1f">Offer</text>
<text x="1124.0" y="182" text-anchor="middle" font-size="19" fill="#4a554e">consenting customers</text>
<path d="M1252 135H1320" stroke="#1a2a1f" stroke-width="4" fill="none" marker-end="url(#ah)"/>
<rect x="1326" y="60" width="244" height="150" rx="18" fill="#ffffff" stroke="#1a2a1f" stroke-width="3"/>
<text x="1348" y="104" font-size="22" font-weight="600" letter-spacing="2" fill="#4d7a5e">5</text>
<text x="1448.0" y="144" text-anchor="middle" font-size="40" font-weight="700" fill="#1a2a1f">Measure</text>
<text x="1448.0" y="182" text-anchor="middle" font-size="19" fill="#4a554e">treated vs holdout</text>
<path d="M1448.0 214V320H152.0V218" stroke="#c4532d" stroke-width="4" fill="none" stroke-dasharray="14 9" marker-end="url(#at)"/>
<rect x="650.0" y="296" width="300" height="48" rx="24" fill="#faf9f5"/>
<text x="800.0" y="329" text-anchor="middle" font-size="26" font-weight="600" fill="#c4532d">priors update</text>
</svg>

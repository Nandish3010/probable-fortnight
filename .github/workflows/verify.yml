name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: make verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: status, path: STATUS.md }
  live-test:
    # Persona walkthrough (make live-test) against the real running stack -- api-test/web-test
    # above only exercise fixtures and mock mode, so this is the only CI job that would have
    # caught the live-mode regressions a judge review found (stale test fixtures, a guardrail id
    # only visible in raw trace JSON). Runs after `verify` so it never masks a base-level red.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv python install 3.11
      - run: uv sync --group dev
      - run: cd web && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: make generate
      - name: Start make api in the background
        run: nohup make api > api.log 2>&1 &
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health > /dev/null && exit 0
            sleep 2
          done
          echo "API never became healthy"; cat api.log; exit 1
      - name: Start make web in the background (mock mode off)
        run: nohup make web > web.log 2>&1 &
      - name: Wait for the web app to be healthy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && exit 0
            sleep 2
          done
          echo "Web app never became healthy"; cat web.log; exit 1
      - run: make live-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-results
          path: |
            api.log
            web.log
            eval/runs/live-results
            eval/runs/screens

  spec-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: Reviewer agent verdict (skips without GOOGLE_CLOUD_PROJECT)
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: asia-south1
          TAAL_MODEL_BACKEND: vertex
        run: uv run python -m harness.spec_review --base origin/${{ github.base_ref }} --out eval/spec_review.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: spec-review, path: eval/spec_review.md }

  deploy:
    # Only after verify is green, and only for a real push to main (never a PR) -- a red or
    # merely-open-PR main is never deployed. Runs infra/deploy.sh for real: this runner has a
    # working gcloud/bq (the local dev sandbox this project was otherwise built in does not,
    # per infra/README.md), so it is the literal script, not the direct-REST-API workaround
    # used for the first manual deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      GOOGLE_CLOUD_PROJECT: amru-509214
      REGION: asia-south1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
        # infra/deploy.sh resolves the copy-generation model id via `python3 -c "import
        # tomllib..."` -- pin a version new enough to have it (3.11+), since ubuntu-latest's
        # default python3 is not guaranteed to be.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Confirm the authenticated identity (must be taal-deploy)
        run: gcloud auth list --format="value(account)"
      - run: bash infra/deploy.sh

[project]
name = "taal"
version = "0.1.0"
description = "Demand-shaping agent system: sells what the forecast says will be thrown away, with a holdout to prove it."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
  "google-adk==2.9.0",
  "google-genai==2.23.0",
  "google-cloud-bigquery==3.45.0",
  "google-cloud-firestore==2.30.0",
  "pydantic==2.13.5",
  "jsonschema==4.26.0",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "duckdb==1.5.5",
  "mcp==2.2.0",
  "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.0",
  "ruff==0.16.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:LoopAgent is deprecated:DeprecationWarning",
  "ignore:.*EXPERIMENTAL.*:UserWarning",
]
markers = [
  "cloud: needs Google Cloud credentials (skipped in CI)",
  "raw_data: needs licensed raw data under data/public/raw (skipped when absent)",
  "slow: takes more than ten seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() in defaults is the framework idiom

[tool.setuptools]
packages = ["agents", "agents.gate", "agents.planner", "agents.customer", "agents.capture", "agents.mcp_orders", "services", "services.api", "harness", "data", "data.generator", "jobs", "jobs.sense", "jobs.measure"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
